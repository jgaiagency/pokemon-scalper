name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.2
          cache: npm
      - run: npm ci
      - run: node --version | grep '^v26\.8\.'
      - run: npm test
      - run: npm run security:scan
      - run: npm run scalper:doctor
      - run: npm run scalper:smoke
